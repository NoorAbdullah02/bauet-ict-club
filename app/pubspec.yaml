name: bauet_ict_club
description: BAUET ICT Club mobile app - events, notices, team, gallery, join flows, AI chat and admin.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^14.6.2
  dio: ^5.8.0+1
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  path_provider: ^2.1.5
  image: ^4.3.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/logos/

# the phone's home-screen icon (CI runs: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/launcher/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/launcher/foreground.png
  remove_alpha_ios: true
