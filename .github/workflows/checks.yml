name: Checks

# Runs on every push to master and on pull requests: the website and server must build, and the Flutter app must analyse, pass its tests and build an APK.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  website:
    name: Website and server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install (root, client and server)
        run: npm ci
      - name: Build the website
        run: npm run build
      - name: End-to-end checks (in-memory database)
        run: npm --prefix server run qa
      - name: Server files parse
        run: |
          set -e
          for f in $(git ls-files 'server/*.js'); do node --check "$f"; done

  app:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # adds the Android project files the repository does not keep; existing files (manifest, network config) are left alone
      - run: flutter create . --org com.bauet --project-name bauet_ict_club --platforms android
      # the permanent club key (GitHub secrets ANDROID_KEYSTORE_*): a new APK then installs OVER an older one. Without the secrets nothing changes.
      - name: Sign with the permanent club key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 ../tools/android_signing.py android
      - run: flutter pub get
      - name: Home-screen icon from the club logo
        run: dart run flutter_launcher_icons
      - name: Analyse (errors fail the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Build a debug APK
        run: flutter build apk --debug --dart-define-from-file=env.production.json
      - uses: actions/upload-artifact@v4
        with:
          name: bauet-ict-club-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      # the version to install on a phone: much smaller and faster than the debug one (arm64 = almost every phone made after 2017)
      - name: Build a release APK (small, fast)
        run: flutter build apk --release --split-per-abi --split-debug-info=build/symbols --dart-define-from-file=env.production.json
      - name: Show who signed the APK (the same fingerprint on every build means updates install over the old app)
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep -E "Owner|SHA256" || true
      - uses: actions/upload-artifact@v4
        with:
          name: bauet-ict-club-phone-apk
          path: |
            app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
