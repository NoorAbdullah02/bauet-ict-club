name: Weekly backup
# Saves every table of the Neon database, encrypted, as a file of a private GitHub release (the 12 newest are kept). Needs two repository secrets:
#   BACKUP_DATABASE_URL  = the Neon connection string        BACKUP_PASSPHRASE = a long secret phrase (needed to open the backup)
on:
  schedule:
    - cron: '30 21 * * 0' # Sunday 21:30 UTC = Monday 03:30 Bangladesh
  workflow_dispatch:
permissions:
  contents: write # to keep the backup as a release file
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: server/package-lock.json }
      - name: Check secrets
        env: { DB: '${{ secrets.BACKUP_DATABASE_URL }}', PP: '${{ secrets.BACKUP_PASSPHRASE }}' }
        run: |
          [ -n "$DB" ] && [ -n "$PP" ] || { echo "::warning::Add the repository secrets BACKUP_DATABASE_URL and BACKUP_PASSPHRASE (see docs/BACKUP.md). Nothing was backed up."; echo SKIP=1 >> "$GITHUB_ENV"; }
      - name: Dump and encrypt
        if: env.SKIP != '1'
        working-directory: server
        env: { DATABASE_URL: '${{ secrets.BACKUP_DATABASE_URL }}', PP: '${{ secrets.BACKUP_PASSPHRASE }}', NODE_ENV: production }
        run: |
          npm ci --omit=dev
          node scripts/backup.js ../dump
          tar -czf - -C .. dump | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:PP -out ../bauet-backup.tar.gz.enc
      # kept as a file of a GitHub release (private, like the repository): releases do not use the small artifact storage
      - name: Keep the backup in a GitHub release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="backup-$(date -u +%Y-%m-%d-%H%M)"
          mv bauet-backup.tar.gz.enc "bauet-$TAG.tar.gz.enc"
          gh release create "$TAG" "bauet-$TAG.tar.gz.enc" --title "Database backup $(date -u +%Y-%m-%d)" --notes "Encrypted backup of every table. Open it with the BACKUP_PASSPHRASE (see docs/BACKUP.md)." --latest=false
          # keep the 12 newest backups
          gh release list --limit 200 --json tagName -q '.[].tagName' | grep '^backup-' | sort -r | tail -n +13 | while read -r t; do gh release delete "$t" --yes --cleanup-tag || true; done
